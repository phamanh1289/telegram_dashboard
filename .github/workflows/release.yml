# Push a tag vX.Y.Z (see .claude/skills/release) -> build every platform package -> GitHub Release.
# The packaged app's Settings > Update reads the latest release and downloads its <platform>.zip.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: npm ci
      - run: npm run build
      - run: uv run --no-project --python 3.14 scripts/package.py ${{ github.ref_name }}
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.7.1 -y --no-progress }
          & $iscc "/DVersion=$('${{ github.ref_name }}'.TrimStart('v'))" packaging\windows\setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\packaging\windows\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
          Copy-Item packaging\windows\install.ps1 dist\install-windows.ps1  # irm | iex avoids SmartScreen
      - name: macOS install script (curl | bash avoids Gatekeeper's quarantine block)
        if: runner.os == 'macOS'
        run: cp packaging/macos/install.sh dist/install-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sh
            dist/*.ps1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (for release_key.pem)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign every zip (the app installs an update only if its .sig matches telegram_dashboard/release_key.pem)
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret RELEASE_SIGNING_KEY is missing (see .claude/skills/release/SKILL.md)"; exit 1; }
          umask 077
          # PEM, or the PEM as one base64 line (survives web-UI pastes that mangle line breaks)
          case "$KEY" in
            *"-----BEGIN"*) printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/key.pem" ;;
            *) printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/key.pem" 2>/dev/null || true ;;
          esac
          openssl rsa -check -noout -in "$RUNNER_TEMP/key.pem" -passin pass: >/dev/null 2>&1 || {
            echo "::error::RELEASE_SIGNING_KEY is not an unencrypted RSA private key ($(wc -l < "$RUNNER_TEMP/key.pem") lines, PUBLIC markers: $(grep -c PUBLIC "$RUNNER_TEMP/key.pem" || true), ENCRYPTED markers: $(grep -c ENCRYPTED "$RUNNER_TEMP/key.pem" || true)). Set it to: base64 -i ~/.config/telegram-dashboard/release_signing_key.pem"
            exit 1; }
          openssl rsa -RSAPublicKey_in -in telegram_dashboard/release_key.pem -pubout -out "$RUNNER_TEMP/pub.pem"
          for z in dist/*.zip; do
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$z.sig" "$z"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$z.sig" "$z"  # secret matches the app's key
          done
          rm -f "$RUNNER_TEMP/key.pem"
      - run: ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Ensure every file is attached (the action dropped one silently in v0.1.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          id=$(jq -r .id <<<"$rel")
          for f in dist/*; do
            n=$(basename "$f")
            jq -e --arg n "$n" '.assets[] | select(.name == $n and .state == "uploaded")' <<<"$rel" >/dev/null && continue
            echo "re-uploading $n"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$n" >/dev/null
          done
