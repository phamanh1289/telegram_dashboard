[project]
name = "telegram-dashboard"
version = "0.1.5"
description = "Local web inbox for Telegram groups"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "uvicorn==0.*",
  "telethon==1.45.0",
  "httpx==0.*",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
telegram-dashboard = "telegram_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
